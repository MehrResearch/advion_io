[project]
name = "advion-io"
version = "0.1.0"
description = "Pure-Python reader and writer for Advion .datx mass-spectrometry data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mehr Research" }]
keywords = ["advion", "mass-spectrometry", "datx", "expression-cms", "chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # marimo is only needed to launch the bundled dashboard; the notebook
    # itself runs in a sandbox built from its own PEP 723 metadata.
    "marimo>=0.23.14",
    "numpy>=2.1.2",
]

[project.urls]
Homepage = "https://github.com/MehrResearch/advion_io"
Repository = "https://github.com/MehrResearch/advion_io"
Issues = "https://github.com/MehrResearch/advion_io/issues"

[project.scripts]
convert-all = "advion_io.convertall:main"
ms-dashboard = "advion_io.dashboard:main"
ms-dashboard-edit = "advion_io.dashboard:edit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advion_io"]

# Ship the root-level notebook inside the package so `ms-dashboard` works from
# an install, not just a checkout.
[tool.hatch.build.targets.wheel.force-include]
"Analysis.py" = "advion_io/Analysis.py"

[tool.hatch.build.targets.sdist]
include = ["src/advion_io", "Analysis.py", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "anywidget>=0.9",
    "matplotlib>=3.9.2",
    "pytest>=8.3.3",
    "scipy>=1.14",
    "seaborn>=0.13",
]
