[project]
name = "advion-io"
version = "0.1.0"
description = "Pure-Python reader and writer for Advion .datx mass-spectrometry data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mehr Research" }]
keywords = ["advion", "mass-spectrometry", "datx", "expression-cms", "chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.1.2",
]

[project.urls]
Homepage = "https://github.com/MehrResearch/advion_io"
Repository = "https://github.com/MehrResearch/advion_io"
Issues = "https://github.com/MehrResearch/advion_io/issues"

[project.scripts]
convert-all = "advion_io.convertall:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advion_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "marimo>=0.13",
    "matplotlib>=3.9.2",
    "pytest>=8.3.3",
]
